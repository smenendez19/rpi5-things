services:
    open-webui:
        ports:
            - 3001:8080
        environment:
            - WEBUI_AUTH=False
            - OLLAMA_BASE_URL=http://127.0.0.1:11434
        extra_hosts:
            - host.docker.internal:host-gateway
        volumes:
            - open-webui:/app/backend/data
        container_name: open-webui
        restart: always
        image: ghcr.io/open-webui/open-webui:main
volumes:
    open-webui:
        external: true
        name: open-webui