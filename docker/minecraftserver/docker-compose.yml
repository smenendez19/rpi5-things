services:
  mc:
    image: itzg/minecraft-server:latest
    tty: true
    stdin_open: true
    ports:
      - "25565:25565/tcp"
    environment:
      EULA: "TRUE"
      VERSION: "1.21.4"
      MEMORY: "4096M"
      MAX_PLAYERS: "5"
      MOTD: "Minecraft server in Raspberry PI"
      TZ: "America/Buenos_Aires"
      DIFFICULTY: "3"
      SIMULATION_DISTANCE: "12"
      VIEW_DISTANCE: "12"
      SPAWN_PROTECTION: "0"
    volumes:
      - "./data:/data"
