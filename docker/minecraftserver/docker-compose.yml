services:
  mc:
    container_name: minecraft-server
    image: itzg/minecraft-server:latest
    tty: true
    stdin_open: true
    ports:
      - "25565:25565/tcp"
    environment:
      EULA: "TRUE"
      VERSION: "26.3"
      MEMORY: "4096M"
      MODE: "survival"
      MAX_PLAYERS: "5"
      MOTD: "Minecraft server in Raspberry PI"
      TZ: "America/Buenos_Aires"
      DIFFICULTY: "hard"
      SIMULATION_DISTANCE: "12"
      VIEW_DISTANCE: "12"
      SPAWN_PROTECTION: "0"
    volumes:
      - "./data:/data"
